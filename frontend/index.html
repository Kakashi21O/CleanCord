<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanCord</title>
  <link rel="icon" type="image/x-icon" href="../assets/cleancord.ico">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ========================================== -->
  <!-- 1. FULLSCREEN LOGIN VIEW (DISCORD THEMED) -->
  <!-- ========================================== -->
  <!-- ========================================== -->
  <!-- 1. TOKEN-ONLY LOGIN VIEW (CLEAN LIGHT THEME)-->
  <!-- ========================================== -->
  <div id="login-view" class="login-page-container">
    <div class="login-wrapper">
      <div class="login-card">
        <div class="login-header">
          <div class="login-logo-box">
            <svg class="discord-logo-svg" viewBox="0 0 127.14 96.36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Discord Logo">
              <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.91,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.91,96.12,53,91.08,65.69,84.69,65.69Z" fill="#5865F2"/>
            </svg>
          </div>
          <h2 class="auth-heading">Login with Token</h2>
          <p class="auth-subheading">
            Enter your Discord authorization token. Tokens are processed in local memory only.
          </p>
        </div>

        <form id="form-token-login" class="auth-form" onsubmit="return false;">
          <div class="form-group">
            <label for="input-token-main" class="form-label">Discord User Token</label>
            <div class="input-with-icon">
              <span class="field-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="7.5" cy="15.5" r="5.5"/>
                  <path d="m21 2-9.6 9.6"/>
                  <path d="m15.5 7.5 3 3L22 7l-3-3"/>
                </svg>
              </span>
              <input 
                type="password" 
                id="input-token-main" 
                class="auth-input" 
                placeholder="Paste your Discord token here" 
                autocomplete="off"
                required
              >
            </div>
          </div>

          <!-- Token Login Error -->
          <div id="token-login-error" class="auth-error-box" style="display: none;" role="alert"></div>

          <!-- Token Submit -->
          <button type="submit" id="btn-token-submit" class="btn-primary-gradient">
            <span class="btn-text">Login with Token</span>
          </button>
        </form>
      </div>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- 2. MAIN APPLICATION VIEW (AFTER LOGIN)    -->
  <!-- ========================================== -->
  <div id="app-view" class="window-container" style="display: none;">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="header-titles">
          <div class="header-title-row">
            <h1 class="app-title">Discord Server Cleanup</h1>
            <span id="status-badge" class="status-badge">Connected</span>
          </div>
          <p class="app-description">View, search and leave Discord servers easily</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="user-profile-summary" id="user-profile-summary">
          <div class="user-avatar-circle" id="user-avatar-container" title="Discord Profile">
            <svg id="avatar-fallback-icon" class="avatar-d-icon" viewBox="0 0 127.14 96.36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Discord Logo">
              <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.91,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.91,96.12,53,91.08,65.69,84.69,65.69Z" fill="#5865F2"/>
            </svg>
            <img id="user-avatar-img" class="user-avatar-image" src="" alt="Discord Avatar" style="display: none;">
          </div>
          <span id="user-display-name" class="user-display-name"></span>
        </div>
        <button id="btn-switch-account" class="btn-secondary" style="font-size: 12px; padding: 4px 10px;">Switch Account</button>
      </div>
    </header>

    <!-- Filter & Search Bar -->
    <section class="controls-section">
      <div class="search-sort-row">
        <div class="search-input-wrapper">
          <input 
            type="text" 
            id="search-input" 
            class="search-input" 
            placeholder="Search by server name or ID..." 
            aria-label="Search servers"
          >
        </div>
        <button id="sort-toggle-btn" class="btn-secondary" title="Sort alphabetically">
          Sort: <span id="sort-order-label">A-Z</span>
        </button>
      </div>
      <div class="category-chips" id="category-chips" role="group" aria-label="Category filters">
        <button class="filter-chip active" data-category="ALL">All</button>
        <button class="filter-chip" data-category="Gaming">Gaming</button>
        <button class="filter-chip" data-category="Anime">Anime</button>
        <button class="filter-chip" data-category="Development">Development</button>
        <button class="filter-chip" data-category="Crypto / DeFi">Crypto / DeFi</button>
        <button class="filter-chip" data-category="NFT">NFT</button>
        <button class="filter-chip" data-category="Trading">Trading</button>
        <button class="filter-chip" data-category="Other">Other</button>
      </div>
    </section>

    <!-- Selection Toolbar -->
    <section class="selection-toolbar">
      <div class="selection-summary">
        <span id="selection-count">0</span> servers selected to leave
      </div>
      <div class="selection-actions">
        <button id="btn-select-all" class="btn-text">Select All</button>
        <button id="btn-deselect-all" class="btn-text">Deselect All</button>
      </div>
    </section>

    <!-- Server List Container -->
    <main class="server-list-container" id="server-list" role="region" aria-label="Discord servers list">
      <!-- Dynamically rendered server rows -->
    </main>

    <!-- Footer / Action Bar -->
    <footer class="footer-actions">
      <div class="export-group">
        <button id="btn-export-json" class="btn-secondary">Export JSON</button>
        <button id="btn-export-csv" class="btn-secondary">Export CSV</button>
      </div>
      <button id="btn-preview-cleanup" class="btn-destructive" disabled>
        Preview Cleanup
      </button>
    </footer>
  </div>

  <!-- Confirmation / Preview Modal -->
  <div id="preview-modal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content" style="max-width: 480px;">
      <h3 id="modal-title" class="modal-title">Confirm Server Cleanup</h3>
      <div id="modal-preview-body">
        <p id="modal-desc" class="modal-desc">
          You are about to leave <strong id="modal-count">0</strong> servers.
        </p>
        <div id="preview-breakdown" style="background: var(--bg-subtle); padding: var(--space-3); border-radius: var(--radius-md); font-size: 12px; margin-bottom: var(--space-4); max-height: 160px; overflow-y: auto;">
          <ul id="preview-server-list" style="list-style: none; display: flex; flex-direction: column; gap: 4px;"></ul>
        </div>
      </div>
      <div id="modal-progress" style="display: none; margin-bottom: var(--space-4);">
        <p id="modal-progress-text" style="font-size: 13px; font-weight: 500; color: var(--accent-primary);">Processing cleanup...</p>
      </div>
      <div id="modal-result" style="display: none; margin-bottom: var(--space-4); font-size: 13px;">
        <p id="modal-result-text" style="color: var(--state-success); font-weight: 600;"></p>
      </div>
      <div class="modal-footer">
        <button id="modal-btn-cancel" class="btn-secondary">Cancel</button>
        <button id="modal-btn-confirm" class="btn-destructive">Leave Servers</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
