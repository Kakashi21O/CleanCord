name: Build and Release CleanCord

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          pyinstaller --noconfirm CleanCord.spec

      - name: Generate SHA-256 Checksum
        run: |
          cd dist
          Get-FileHash -Algorithm SHA256 CleanCord.exe | ForEach-Object { "$($_.Hash)  CleanCord.exe" } | Out-File -Encoding utf8 SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload CleanCord.exe and Checksums to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CleanCord ${{ github.ref_name }}
          files: |
            dist/CleanCord.exe
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
